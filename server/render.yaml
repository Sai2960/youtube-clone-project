services:
  - type: web
    name: youtube-clone-backend
    runtime: node
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && node index.js
    healthCheckPath: /health
    autoDeploy: true
    
    envVars:
      # Server Configuration
      - key: NODE_ENV
        value: production
      
      - key: PORT
        value: 5000
      
      - key: BASE_URL
        value: https://youtube-clone-project-q3pd.onrender.com
      
      # Authentication (set manually in Render dashboard)
      - key: JWT_SECRET
        sync: false
      
      # Database (set manually in Render dashboard)
      - key: DB_URL
        sync: false
      
      # CORS (set manually in Render dashboard)
      - key: ALLOWED_ORIGINS
        sync: false
      
      # Cloudinary (set manually in Render dashboard)
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      
      - key: CLOUDINARY_API_KEY
        sync: false
      
      - key: CLOUDINARY_API_SECRET
        sync: false
      
      # Email (set manually in Render dashboard)
      - key: EMAIL_USER
        sync: false
      
      - key: EMAIL_PASSWORD
        sync: false
      
      # Razorpay (set manually in Render dashboard)
      - key: RAZORPAY_KEY_ID
        sync: false
      
      - key: RAZORPAY_KEY_SECRET
        sync: false
      
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      
      # Twilio (set manually in Render dashboard)
      - key: TWILIO_ACCOUNT_SID
        sync: false
      
      - key: TWILIO_AUTH_TOKEN
        sync: false
      
      - key: TWILIO_PHONE_NUMBER
        sync: false
      
      - key: TWILIO_VERIFIED_NUMBER
        sync: false
      
      # Frontend (set manually in Render dashboard)
      - key: FRONTEND_URL
        sync: false
      
      # Location Testing (set manually in Render dashboard)
      - key: TEST_GEO_STATE
        sync: false
      
      - key: LOCAL_TEST_STATE
        sync: false